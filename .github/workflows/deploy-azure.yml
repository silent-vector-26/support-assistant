name: Test and deploy to Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "data/**"
      - "tests/**"
      - "evaluation/**"
      - "infra/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test application and validate Bicep
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile app.py fieldtech_assistant.py explanations.py tests/test_fieldtech_assistant.py

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Verify the container builds
        run: docker build --file Dockerfile --tag field-tech-copilot:ci .

  browser:
    name: Browser acceptance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise browser acceptance scenarios
        run: python -m unittest discover -s tests/browser -v
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Provision infrastructure and deploy container
    needs: [validate, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: azure-production
    concurrency:
      group: azure-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_DEPLOYER_OBJECT_ID }}
      AZURE_VISION_ENDPOINT: ${{ vars.AZURE_VISION_ENDPOINT }}
      AZURE_VISION_KEY: ${{ secrets.AZURE_VISION_KEY }}
      DEPLOYMENT_LOCATION: eastus2
      IMAGE_NAME: field-tech-copilot
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required Azure configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_DEPLOYER_OBJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name as a variable in the azure-production GitHub Environment."
              exit 1
            fi
          done
          if [[ -n "$AZURE_VISION_ENDPOINT" && -z "$AZURE_VISION_KEY" ]] || \
             [[ -z "$AZURE_VISION_ENDPOINT" && -n "$AZURE_VISION_KEY" ]]; then
            echo "::error::Configure both Azure Vision settings or neither."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure, preserving the existing application image
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          resource_group=$(jq -r '.parameters.resourceGroupName.value' infra/main.parameters.json)
          app_name=$(jq -r '.parameters.containerAppName.value' infra/main.parameters.json)
          args=(
            --name "field-tech-copilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-infra"
            --location "$DEPLOYMENT_LOCATION"
            --template-file infra/main.bicep
            --parameters "@infra/main.parameters.json"
            "deployerObjectId=$AZURE_DEPLOYER_OBJECT_ID"
            "deployedBy=$GITHUB_ACTOR"
            "createdAt=$created_at"
          )
          group_exists=$(az group exists --name "$resource_group")
          if [[ "$group_exists" == "true" ]]; then
            current_image=$(az containerapp list --resource-group "$resource_group" \
              --query "[?name=='$app_name'].properties.template.containers[0].image | [0]" -o tsv)
            if [[ -n "$current_image" ]]; then
              args+=("containerImage=$current_image")
            fi
          fi
          if [[ -n "$AZURE_VISION_ENDPOINT" && -n "$AZURE_VISION_KEY" ]]; then
            args+=("visionEndpoint=$AZURE_VISION_ENDPOINT" "visionKey=$AZURE_VISION_KEY")
          fi
          result=$(az deployment sub create "${args[@]}")
          outputs=$(jq -c '.properties.outputs' <<< "$result")
          echo "registry=$(jq -r '.registryLoginServer.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.resourceGroupName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "app_name=$(jq -r '.containerAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "app_fqdn=$(jq -r '.containerAppFqdn.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Allow RBAC propagation
        run: sleep 90

      - name: Build and push the application image
        shell: bash
        env:
          REGISTRY: ${{ steps.provision.outputs.registry }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          az acr login --name "${REGISTRY%%.*}"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy the application image
        shell: bash
        run: |
          set -euo pipefail
          created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          args=(
            --name "field-tech-copilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-app"
            --location "$DEPLOYMENT_LOCATION"
            --template-file infra/main.bicep
            --parameters "@infra/main.parameters.json"
            "deployerObjectId=$AZURE_DEPLOYER_OBJECT_ID"
            "deployedBy=$GITHUB_ACTOR"
            "createdAt=$created_at"
            "containerImage=$IMAGE"
          )
          if [[ -n "$AZURE_VISION_ENDPOINT" && -n "$AZURE_VISION_KEY" ]]; then
            args+=("visionEndpoint=$AZURE_VISION_ENDPOINT" "visionKey=$AZURE_VISION_KEY")
          fi
          az deployment sub create "${args[@]}"

      - name: Verify the live application health endpoint
        shell: bash
        env:
          APP_FQDN: ${{ steps.provision.outputs.app_fqdn }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$APP_FQDN/_stcore/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The Container App did not pass its live health check."
          exit 1
