name: Test and deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test application and validate Bicep
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile app.py fieldtech_assistant.py tests/test_fieldtech_assistant.py

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Provision infrastructure and deploy container
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_DEPLOYER_OBJECT_ID }}
      AZURE_VISION_ENDPOINT: ${{ vars.AZURE_VISION_ENDPOINT }}
      AZURE_VISION_KEY: ${{ secrets.AZURE_VISION_KEY }}
      DEPLOYMENT_LOCATION: eastus2
      IMAGE_NAME: field-tech-copilot
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required Azure configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_DEPLOYER_OBJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name as a variable in the azure-production GitHub Environment."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision the registry and Container App with placeholder image
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          result=$(az deployment sub create \
            --name "field-tech-copilot-${GITHUB_RUN_ID}-infra" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
              deployerObjectId="$AZURE_DEPLOYER_OBJECT_ID" \
              deployedBy="$GITHUB_ACTOR" \
              createdAt="$created_at")
          outputs=$(jq -c '.properties.outputs' <<< "$result")
          echo "registry=$(jq -r '.registryLoginServer.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.resourceGroupName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "app_name=$(jq -r '.containerAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "app_fqdn=$(jq -r '.containerAppFqdn.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Allow RBAC propagation
        run: sleep 90

      - name: Build and push the application image
        shell: bash
        env:
          REGISTRY: ${{ steps.provision.outputs.registry }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          az acr login --name "${REGISTRY%%.*}"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy the application image
        shell: bash
        run: |
          set -euo pipefail
          created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          args=(
            --name "field-tech-copilot-${GITHUB_RUN_ID}-app"
            --location "$DEPLOYMENT_LOCATION"
            --template-file infra/main.bicep
            --parameters "@infra/main.parameters.json"
            "deployerObjectId=$AZURE_DEPLOYER_OBJECT_ID"
            "deployedBy=$GITHUB_ACTOR"
            "createdAt=$created_at"
            "containerImage=$IMAGE"
          )
          if [[ -n "$AZURE_VISION_ENDPOINT" && -n "$AZURE_VISION_KEY" ]]; then
            args+=("visionEndpoint=$AZURE_VISION_ENDPOINT" "visionKey=$AZURE_VISION_KEY")
          fi
          az deployment sub create "${args[@]}"

      - name: Verify the live application health endpoint
        shell: bash
        env:
          APP_FQDN: ${{ steps.provision.outputs.app_fqdn }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$APP_FQDN/_stcore/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The Container App did not pass its live health check."
          exit 1
